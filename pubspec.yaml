name: flutter_data
description: >
  The seamless way to work with persistent data models in Flutter. Inspired by
  Ember Data and ActiveRecord.
version: 1.6.0
homepage: https://github.com/flutterdata/flutter_data
documentation: https://flutterdata.dev/

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  analyzer: '>=6.1.0 <15.0.0'
  async: ^2.6.1
  build: '>=2.0.2 <5.0.0'
  collection: ^1.16.0
  crypto: ^3.0.1
  equatable: ^2.0.2
  glob: ^2.0.1
  hive_ce: ^2.0.0
  http: ^1.2.0
  inflection3: ^0.5.3+2
  json_annotation: ^4.8.1
  meta: ^1.10.0
  path: ^1.8.0
  pool: ^1.5.1
  pubspec_parse: ^1.0.0
  recase: ^4.0.0
  retry: ^3.1.0
  riverpod: '>=2.1.1 <4.0.0'
  source_gen: '>=1.0.1 <5.0.0'
  source_helper: ^1.3.2
  state_notifier: ^1.0.0
  uuid: ^4.2.1

dev_dependencies:
  build_runner: ^2.6.0
  coverage: ^1.3.2
  freezed: ^3.0.0
  freezed_annotation: ^3.0.0
  json_serializable: ^6.7.1
  lints: ^3.0.0
  matcher: ^0.12.10
  mockito: ^5.0.9
  source_gen_test: ^1.0.0
  test: ^1.22.0

# frontend_server_client 3.2.0 (what every consumer here resolves to
# unforced) can't find frontend_server.dart.snapshot under current Dart
# SDKs — the file's location changed and 3.2.0 predates that. The fix
# lives entirely in frontend_server_client's own 4.0.0 release, not in
# anything this package controls; the transitive constraints from test/
# build_runner already allow 4.x, nothing was pinning it low on purpose.
# See https://github.com/dart-lang/sdk/issues/60198.
dependency_overrides:
  frontend_server_client: ^4.0.0
