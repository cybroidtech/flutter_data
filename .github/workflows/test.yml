name: test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux
          - windows
          - macos
          - web
        include:
          - platform: linux
            os: ubuntu-latest
          - platform: windows
            os: windows-latest
          - platform: macos
            os: macos-latest
            sdk: stable
          - platform: web
            os: ubuntu-latest
            dartTestArgs: -p chrome

    runs-on: ${{ matrix.os }}

    steps:
      - uses: dart-lang/setup-dart@v1.5
      - uses: actions/checkout@v2
      - name: Install dependencies
        run: dart pub get
      - name: Run tests
        run: dart test
      - name: Generate coverage
        if: runner.os == 'macOS'
        run: dart run coverage:test_with_coverage
      - name: Send coverage report to codecov
        if: runner.os == 'macOS'
        uses: codecov/codecov-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  # Verifies flutter_data's own builders (data_library_builder,
  # repository_builder) still generate against a current build_runner,
  # in isolation from any other codegen package (riverpod_generator etc.)
  # a consuming app might also have in its graph. Apps that see
  # build_runner fail with those combined shouldn't read that as this
  # fork's codegen being broken — see whether the failure survives
  # without flutter_data in the mix before assuming this fork is at fault.
  codegen:
    runs-on: ubuntu-latest
    steps:
      - uses: dart-lang/setup-dart@v1.5
      - uses: actions/checkout@v2
      - name: Install dependencies (root)
        run: dart pub get
      - name: Install dependencies (example)
        working-directory: example
        run: dart pub get
      - name: Generate
        working-directory: example
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Fail if generation produced no output
        working-directory: example
        run: test -f lib/main.data.dart || (echo "::error::main.data.dart was not generated" && exit 1)
